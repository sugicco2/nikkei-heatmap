name: Update Nikkei Heatmap Data

on:
  schedule:
    # 平日の日本時間 12:05 (昼休み) と 15:45 (大引け後) に自動実行
    - cron: '5 3 * * 1-5'
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # 手動でいつでも実行できるボタンを追加

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なツールのインストール
        run: pip install yfinance pandas

      - name: 株価データの取得と計算
        run: python fetch_data.py

      - name: データの保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update stock data" || exit 0
          git push
