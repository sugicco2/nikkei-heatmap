<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>日経225 ヒートマップ</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #16181d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: #1e2128;
      border-bottom: 1px solid #2e323c;
      flex-wrap: wrap;
      gap: 6px;
    }
    .title-area { display: flex; align-items: baseline; gap: 8px; }
    h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    #updated { font-size: 11px; color: #8e96a4; }
    .controls { display: flex; gap: 4px; }
    button {
      background: #2b303b;
      color: #c5cbd6;
      border: 1px solid #3c4250;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    button.active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }
    #chart { flex: 1; width: 100%; }
    footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px 10px;
      background-color: #1e2128;
      border-top: 1px solid #2e323c;
      gap: 3px;
      font-size: 11px;
      font-weight: bold;
    }
    .legend-box {
      padding: 3px 8px;
      border-radius: 3px;
      text-align: center;
      min-width: 44px;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-area">
      <h1>日経225 Map</h1>
      <span id="updated">読込中...</span>
    </div>
    <div class="controls" id="period-buttons">
      <button data-period="1D" class="active">1D</button>
      <button data-period="1W">1W</button>
      <button data-period="1M">1M</button>
      <button data-period="YTD">YTD</button>
      <button data-period="1Y">1Y</button>
    </div>
  </header>

  <div id="chart"></div>

  <footer id="legend"></footer>

  <script>
    const chartDom = document.getElementById('chart');
    const myChart = echarts.init(chartDom);
    let rawData = null;
    let currentPeriod = '1D';

    // 期間ごとの色の濃淡の最大基準値（%）
    const scaleMaxMap = { '1D': 3, '1W': 6, '1M': 10, 'YTD': 25, '1Y': 30 };

    // Finviz風の赤〜グレー〜緑の色計算
    function getFinvizColor(val, maxRange) {
      if (!val || isNaN(val)) return '#2d3139';
      const ratio = Math.min(Math.abs(val) / maxRange, 1);
      if (val > 0) {
        const r = Math.round(42 - ratio * 24);
        const g = Math.round(68 + ratio * 115);
        const b = Math.round(56 + ratio * 24);
        return `rgb(${r},${g},${b})`;
      } else {
        const r = Math.round(76 + ratio * 164);
        const g = Math.round(44 - ratio * 14);
        const b = Math.round(48 - ratio * 16);
        return `rgb(${r},${g},${b})`;
      }
    }

    function updateLegend(maxRange) {
      const steps = [-1, -0.66, -0.33, 0, 0.33, 0.66, 1];
      const legendEl = document.getElementById('legend');
      legendEl.innerHTML = steps.map(s => {
        const val = Math.round(s * maxRange * 10) / 10;
        const label = val > 0 ? `+${val}%` : `${val}%`;
        const bg = getFinvizColor(val, maxRange);
        return `<div class="legend-box" style="background:${bg}">${label}</div>`;
      }).join('');
    }

    function renderChart() {
      if (!rawData || !Array.isArray(rawData.sectors)) return;
      const maxRange = scaleMaxMap[currentPeriod] || 3;
      updateLegend(maxRange);

      const treeData = rawData.sectors.map(sec => ({
        name: sec.name,
        children: sec.children.map(item => {
          const pct = Number(item[currentPeriod] || 0);
          return {
            name: item.name,
            value: [Number(item.weight || 0.1), pct, Number(item.price || 0), item.code],
            itemStyle: {
              color: getFinvizColor(pct, maxRange),
              borderColor: '#16181d',
              borderWidth: 1.5
            }
          };
        })
      }));

      myChart.setOption({
        tooltip: {
          backgroundColor: 'rgba(22, 24, 29, 0.95)',
          borderColor: '#4b5563',
          textStyle: { color: '#fff', fontSize: 13 },
          formatter: function (info) {
            const d = info.data;
            if (!d || !Array.isArray(d.value)) return info.name;
            const [weight, pct, price, code] = d.value;
            const sign = pct > 0 ? '+' : '';
            const color = pct > 0 ? '#4ade80' : (pct < 0 ? '#f87171' : '#ccc');
            return `
              <div style="font-weight:bold;font-size:14px;">${d.name} (${code})</div>
              <div>現在値: <b>${price.toLocaleString()}円</b></div>
              <div>構成比: <b>${weight.toFixed(2)}%</b></div>
              <div>騰落率 (${currentPeriod}): <b style="color:${color};font-size:15px;">${sign}${pct.toFixed(2)}%</b></div>
            `;
          }
        },
        series: [{
          type: 'treemap',
          width: '100%',
          height: '100%',
          roam: false,
          nodeClick: false,
          breadcrumb: { show: false },
          label: {
            show: true,
            position: 'inside',
            formatter: function (params) {
              const d = params.data;
              if (!d || !Array.isArray(d.value) || typeof d.value[1] !== 'number') return '';
              const pct = d.value[1];
              const sign = pct > 0 ? '+' : '';
              return `{name|${d.name}}\n{pct|${sign}${pct.toFixed(2)}%}`;
            },
            rich: {
              name: { fontSize: 12, fontWeight: 'bold', color: '#fff', lineHeight: 16 },
              pct: { fontSize: 11, color: '#f3f4f6', lineHeight: 14 }
            }
          },
          upperLabel: {
            show: true,
            height: 20,
            color: '#e5e7eb',
            backgroundColor: '#22262f',
            fontSize: 11,
            fontWeight: 'bold',
            padding: [0, 6]
          },
          levels: [
            {
              itemStyle: { borderColor: '#16181d', borderWidth: 3, gapWidth: 2 }
            },
            {
              itemStyle: { borderColor: '#2c313c', borderWidth: 1, gapWidth: 1 }
            }
          ],
          data: treeData
        }]
      });
    }

    // データ読み込み
    fetch('data.json?t=' + Date.now())
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        rawData = data;
        document.getElementById('updated').textContent = `更新: ${data.updated_at}`;
        renderChart();
      })
      .catch(err => {
        console.error(err);
        document.getElementById('updated').textContent = 'データ準備中（Actionsを実行してください）';
      });

    // 期間ボタン切り替え
    document.getElementById('period-buttons').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#period-buttons button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentPeriod = e.target.dataset.period;
      renderChart();
    });

    window.addEventListener('resize', () => myChart.resize());
  </script>
</body>
</html>
