<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>日本株 ヒートマップ</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background: #16181d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
    body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; background: #1e2128; border-bottom: 1px solid #2e323c; gap: 6px; flex-shrink: 0; z-index: 10; }
    .left-area { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .index-switch { display: flex; background: #13151a; padding: 2px; border-radius: 7px; border: 1px solid #323744; flex-shrink: 0; }
    .index-switch button { background: transparent; border: none; color: #8e96a4; padding: 4px 7px; font-size: 11px; font-weight: 700; border-radius: 5px; cursor: pointer; }
    .index-switch button.active { background: #e5e7eb; color: #111827; }
    .index-quote { display: flex; flex-direction: column; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .quote-top { display: flex; align-items: baseline; gap: 4px; }
    #index-val { font-size: 13px; font-weight: 800; color: #f9fafb; }
    #index-chg { font-size: 11px; font-weight: 700; }
    #updated { font-size: 9px; color: #6b7280; }
    .controls { display: flex; gap: 2px; flex-shrink: 0; }
    .controls button { background: #2b303b; color: #c5cbd6; border: 1px solid #3c4250; padding: 4px 6px; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .controls button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    #chart-wrap { flex: 1; min-height: 0; width: 100%; position: relative; overflow: hidden; touch-action: none; }
    #chart { width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
    @media (min-width: 600px) {
      .index-quote { flex-direction: row; align-items: baseline; gap: 8px; }
      #index-val { font-size: 15px; }
      #index-chg { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="left-area">
      <div class="index-switch" id="index-buttons">
        <button data-index="nikkei225" class="active">日経225</button>
        <button data-index="topix">TOPIX</button>
      </div>
      <div class="index-quote">
        <div class="quote-top"><span id="index-val">--</span><span id="index-chg"></span></div>
        <span id="updated">読込中...</span>
      </div>
    </div>
    <div class="controls" id="period-buttons">
      <button data-period="1D" class="active">1D</button>
      <button data-period="1W">1W</button>
      <button data-period="1M">1M</button>
      <button data-period="YTD">YTD</button>
      <button data-period="1Y">1Y</button>
    </div>
  </header>
  <div id="chart-wrap"><div id="chart"></div></div>
  <script>
    const wrap = document.getElementById('chart-wrap');
    const chartDom = document.getElementById('chart');
    const dpr = Math.min(Math.max(window.devicePixelRatio || 2, 2.5), 4);
    const myChart = echarts.init(chartDom, null, { devicePixelRatio: dpr });

    let rawData = null, currentIndex = 'nikkei225', currentPeriod = '1D';
    let scale = 1, tx = 0, ty = 0, tileSizes = {}, zoomTimer = null;
    const scaleMaxMap = { '1D': 3, '1W': 6, '1M': 10, 'YTD': 25, '1Y': 30 };

    function scheduleLabelRefresh() {
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(() => renderChart(false), 60);
    }

    function applyTransform(refreshLabels = false) {
      const W = wrap.clientWidth, H = wrap.clientHeight;
      scale = Math.max(1, Math.min(6, scale));
      if (scale <= 1.005) { scale = 1; tx = 0; ty = 0; }
      else {
        tx = Math.min(0, Math.max(W * (1 - scale), tx));
        ty = Math.min(0, Math.max(H * (1 - scale), ty));
      }
      chartDom.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
      if (refreshLabels) scheduleLabelRefresh();
    }

    function zoomAt(newScale, clientX, clientY, refreshLabels = false) {
      const rect = wrap.getBoundingClientRect();
      const px = clientX - rect.left, py = clientY - rect.top;
      const clamped = Math.max(1, Math.min(6, newScale));
      const ratio = clamped / scale;
      tx = px - (px - tx) * ratio;
      ty = py - (py - ty) * ratio;
      scale = clamped;
      applyTransform(refreshLabels);
    }

    function resetTransform() { scale = 1; tx = 0; ty = 0; applyTransform(false); }

    let tMode = null, startX = 0, startY = 0, startTx = 0, startTy = 0, startDist = 0, startScale = 1, moved = false, lastTap = 0;
    wrap.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        tMode = 'pan'; moved = false;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY; startTx = tx; startTy = ty;
      } else if (e.touches.length === 2) {
        tMode = 'pinch'; moved = true;
        startDist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
        startScale = scale;
      }
    }, { passive: true });

    wrap.addEventListener('touchmove', e => {
      if (tMode === 'pinch' && e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(e.touches[1].clientX - e.touches[0].clientX, e.touches[1].clientY - e.touches[0].clientY);
        zoomAt(startScale * (dist / startDist), (e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2, false);
      } else if (tMode === 'pan' && e.touches.length === 1 && scale > 1) {
        const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
        if (Math.hypot(dx, dy) > 4) moved = true;
        if (moved) { e.preventDefault(); tx = startTx + dx; ty = startTy + dy; applyTransform(false); }
      }
    }, { passive: false });

    wrap.addEventListener('touchend', e => {
      if (tMode === 'pinch') scheduleLabelRefresh();
      if (!moved && e.changedTouches.length === 1) {
        const now = Date.now();
        if (now - lastTap < 300) {
          if (scale > 1) { resetTransform(); scheduleLabelRefresh(); }
          else zoomAt(2.8, e.changedTouches[0].clientX, e.changedTouches[0].clientY, true);
          lastTap = 0;
        } else { lastTap = now; }
      }
      if (e.touches.length === 0) tMode = null;
    });

    let mDrag = false;
    wrap.addEventListener('wheel', e => {
      e.preventDefault();
      zoomAt(scale * (e.deltaY < 0 ? 1.15 : 0.87), e.clientX, e.clientY, true);
    }, { passive: false });
    wrap.addEventListener('mousedown', e => { if (scale > 1) { mDrag = true; startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty; } });
    window.addEventListener('mousemove', e => { if (mDrag) { tx = startTx + (e.clientX - startX); ty = startTy + (e.clientY - startY); applyTransform(false); } });
    window.addEventListener('mouseup', () => { mDrag = false; });
    wrap.addEventListener('dblclick', e => {
      if (scale > 1) { resetTransform(); scheduleLabelRefresh(); }
      else zoomAt(2.8, e.clientX, e.clientY, true);
    });

    function getColor(val, maxRange) {
      if (!val || isNaN(val)) return '#2d3139';
      const r = Math.min(Math.abs(val) / maxRange, 1);
      return val > 0 ? `rgb(${Math.round(42 - r * 24)},${Math.round(68 + r * 115)},${Math.round(56 + r * 24)})`
                     : `rgb(${Math.round(76 + r * 164)},${Math.round(44 - r * 14)},${Math.round(48 - r * 16)})`;
    }

    function buildDynamicLabel(name, pct, code) {
      const sz = tileSizes[code];
      if (!sz) return { show: false };
      const availW = sz.w * scale - 4;
      const availH = sz.h * scale - 3;
      if (availW < 18 || availH < 12) return { show: false };

      let units = 0;
      for (let i = 0; i < name.length; i++) units += name.charCodeAt(i) > 255 ? 1.0 : 0.6;
      units = Math.max(units, 1.5);

      if (availH < 23 || availW < 24) {
        const visF = Math.max(6.2, Math.min(13, availH * 0.62, availW / (units + 0.3)));
        return {
          show: true, position: 'inside', overflow: 'truncate', formatter: name,
          fontSize: +(visF / scale).toFixed(2), fontWeight: 'bold', color: '#fff'
        };
      }
      const visN = Math.max(6.8, Math.min(16, availH * 0.32, availW / (units + 0.4)));
      const visP = Math.max(6.0, Math.min(13, visN * 0.85, availH * 0.26, availW / 4.6));
      const sign = pct > 0 ? '+' : '';
      return {
        show: true, position: 'inside', overflow: 'truncate',
        formatter: `{n|${name}}\n{p|${sign}${pct.toFixed(2)}%}`,
        rich: {
          n: { fontSize: +(visN / scale).toFixed(2), fontWeight: 'bold', color: '#fff', lineHeight: +(visN * 1.18 / scale).toFixed(2) },
          p: { fontSize: +(visP / scale).toFixed(2), color: '#f3f4f6', lineHeight: +(visP * 1.15 / scale).toFixed(2) }
        }
      };
    }

    function captureTileSizes() {
      tileSizes = {};
      try {
        const sm = myChart.getModel().getSeriesByIndex(0);
        const vr = sm && sm.getViewRoot();
        const data = sm && sm.getData();
        if (vr && data) {
          vr.eachNode(node => {
            const raw = data.getRawDataItem(node.dataIndex);
            const lay = node.getLayout();
            if (raw && Array.isArray(raw.value) && lay && lay.width > 0 && lay.height > 0) {
              tileSizes[raw.value[3]] = { w: lay.width, h: lay.height };
            }
          });
        }
      } catch (e) {}
    }

    function renderChart(recalcLayout = true) {
      if (!rawData) return;
      const info = rawData.index_summary && rawData.index_summary[currentIndex];
      const valEl = document.getElementById('index-val'), chgEl = document.getElementById('index-chg');
      if (info) {
        const p = Number(info[currentPeriod] || 0);
        valEl.textContent = Number(info.value).toLocaleString('ja-JP', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        chgEl.textContent = `${p > 0 ? '+' : ''}${p.toFixed(2)}%`;
        chgEl.style.color = p > 0 ? '#4ade80' : (p < 0 ? '#f87171' : '#9ca3af');
      }
      const list = rawData.indices ? rawData.indices[currentIndex] : rawData.sectors;
      if (!Array.isArray(list)) return;
      const isMobile = window.innerWidth < 600, maxR = scaleMaxMap[currentPeriod] || 3;

      const treeData = list.map(sec => ({
        name: sec.name,
        children: sec.children.map(it => {
          const pct = Number(it[currentPeriod] || 0);
          return {
            name: it.name,
            value: [Number(it.weight || 0.1), pct, Number(it.price || 0), it.code],
            label: buildDynamicLabel(it.name, pct, it.code),
            itemStyle: { color: getColor(pct, maxR), borderColor: '#16181d', borderWidth: 1 }
          };
        })
      }));

      myChart.setOption({
        animation: false,
        tooltip: {
          appendToBody: true, confine: true,
          backgroundColor: 'rgba(22,24,29,0.95)', borderColor: '#4b5563', textStyle: { color: '#fff', fontSize: 12 },
          formatter: i => {
            const d = i.data;
            if (!d || !Array.isArray(d.value)) return i.name;
            const [w, pct, pr, code] = d.value;
            return `<div style="font-weight:bold">${d.name} (${code})</div><div>現在値: <b>${pr.toLocaleString()}円</b></div><div>構成比: <b>${w.toFixed(2)}%</b></div><div>騰落率: <b style="color:${pct > 0 ? '#4ade80' : '#f87171'}">${pct > 0 ? '+' : ''}${pct.toFixed(2)}%</b></div>`;
          }
        },
        series: [{
          type: 'treemap', left: 0, right: 0, top: 0, bottom: 0, roam: false, nodeClick: false, breadcrumb: { show: false },
          levels: [
            { itemStyle: { borderColor: '#16181d', borderWidth: 1.5, gapWidth: 1 } },
            { itemStyle: { borderColor: '#16181d', borderWidth: 1.5, gapWidth: 1 },
              upperLabel: { show: true, height: isMobile ? 15 : 17, color: '#9ca3af', backgroundColor: '#1b1e26', fontSize: isMobile ? 9 : 10, fontWeight: 'bold', padding: [0, 3], overflow: 'truncate', formatter: '{b}' } },
            { itemStyle: { borderColor: '#16181d', borderWidth: 1, gapWidth: 0 }, upperLabel: { show: false } }
          ],
          data: treeData
        }]
      });

      if (recalcLayout) {
        captureTileSizes();
        renderChart(false);
      }
    }

    fetch('data.json?t=' + Date.now()).then(r => r.json()).then(d => {
      rawData = d;
      document.getElementById('updated').textContent = d.updated_at;
      renderChart(true);
    });

    document.getElementById('index-buttons').onclick = e => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#index-buttons button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentIndex = e.target.dataset.index;
      resetTransform();
      renderChart(true);
    };
    document.getElementById('period-buttons').onclick = e => {
      if (e.target.tagName !== 'BUTTON') return;
      document.querySelectorAll('#period-buttons button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentPeriod = e.target.dataset.period;
      renderChart(false);
    };
    window.onresize = () => { resetTransform(); myChart.resize(); renderChart(true); };
  </script>
</body>
</html>
